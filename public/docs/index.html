<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GeoView Dashboards - Configuration Guide</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Configuration reference for GeoView Dashboards" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: 'GeoView Dashboards',
        repo: 'https://github.com/MatthewMuehlhauserNRCan/geoview_dashboards',
        loadSidebar: '_sidebar.md',
        // Nested routes (e.g. guide/panels) otherwise request _sidebar.md relative to
        // their own folder (guide/_sidebar.md, which doesn't exist) instead of the root one.
        alias: {
          '/.*/_sidebar.md': '/_sidebar.md',
        },
        // Links out of the docsify site (to the example/editor pages) shouldn't be
        // rewritten into hash routes - leave them as normal page navigations.
        noCompileLinks: ['../editor.html', '../example.html'],
        subMaxLevel: 3,
        auto2top: true,
        search: {
          placeholder: 'Search the guide...',
          noData: 'No results found.',
          depth: 6,
        },
      };
    </script>
    <!-- Docsify v4 -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <!-- Search plugin -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  </body>
</html>
